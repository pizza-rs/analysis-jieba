[package]
name = "pizza-analysis-jieba"
version = "0.1.0"
edition = "2021"
description = "Jieba Chinese segmentation plugin for INFINI Pizza"
repository = "https://github.com/pizza-rs/analysis-jieba"
categories = ["text-processing"]
keywords = ["pizza", "jieba", "chinese", "tokenizer", "search"]
authors = ["INFINI Labs Team",]
license = "MIT"



[features]
default = ["default-dict"]
# Use jieba-rs's embedded default dictionary as the fallback when no
# external dict.txt is configured (standalone/test builds are self-
# contained). The default pizza build opts out (the dictionary plus the
# unused tfidf idf table cost ~11MB of binary) and loads
# `<dict_dir>/jieba/dict.txt` instead — deploy it with
# `make init-analysis-dicts`.
default-dict = ["jieba-rs/default-dict"]
std = ["pizza-engine/std"]

[dependencies]
pizza-common = { path = "../../lib/common" }
pizza-engine = { path = "../../lib/engine", default-features = false }

jieba-rs = { version = "0.7", default-features = false }
